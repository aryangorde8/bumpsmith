name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token needs nothing beyond reading the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      # Each check runs even if an earlier one fails, so one pull request
      # surfaces every problem instead of one problem per push.
      - name: Lint
        if: '!cancelled()'
        run: ruff check .

      - name: Format
        if: '!cancelled()'
        run: ruff format --check .

      - name: Types
        if: '!cancelled()'
        run: mypy

      - name: Tests
        if: '!cancelled()'
        run: pytest
